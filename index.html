<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--card:#17221e;--tx:#eaf1ed;--mut:#9bb0a6;--ac:#4cc79a;--ac2:#1d3a2f;--bd:#273830;--gold:#e0b45a;--gl:#33290f;--red:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0f1714;--card:#17221e;--tx:#eaf1ed;--mut:#9bb0a6;--ac:#4cc79a;--ac2:#1d3a2f;--bd:#273830;--gold:#e0b45a;--gl:#33290f;--red:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;line-height:1.7;padding:12px 12px 100px;max-width:680px;margin-inline:auto}
button,input,textarea{font-family:inherit}button{cursor:pointer}
.hi{font-size:19px;font-weight:700;margin:4px 2px 0}
.nav{display:flex;align-items:center;gap:8px;margin:6px 0}
.nav button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:7px 12px;font-size:14px}
.nav .d{flex:1;text-align:center;font-weight:600;font-size:14px;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0}
.bar{height:9px;background:var(--ac2);border-radius:6px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .25s}
h2{font-size:15px;margin:18px 4px 8px;color:var(--gold)}
h2.late{color:var(--red)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
.card.done{border-color:var(--ac);background:var(--ac2)}
.t{font-size:15.5px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.cnt{font-size:20px;font-weight:700;color:var(--ac)}
.cnt small{font-size:12.5px;color:var(--mut);font-weight:400}
.btns{display:flex;gap:6px}
.btns button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:11px;padding:9px 12px;font-size:14px;min-width:44px}
.btns .p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700;padding:9px 18px}
.btns .run{background:var(--gold);border-color:var(--gold)}
.big{font-size:34px;font-weight:700;color:var(--ac);text-align:center;margin:4px 0;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:11px 6px;font-size:14.5px;line-height:1.4}
.seg button small{display:block;font-size:11.5px;color:var(--mut)}
.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}.seg .on small{color:#e6f4ee}
.now{background:var(--gl);border-radius:12px;padding:9px 12px;font-size:13.5px;margin:8px 0}
.msg{background:var(--gl);border-radius:12px;padding:9px 12px;margin-top:10px;font-size:13.5px}
.tk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:10px;margin:6px 0}
.tk.done{background:var(--ac2);border-color:var(--ac)}
.tk.done .tx div{text-decoration:line-through;color:var(--mut)}
.tk.late{border-color:var(--red)}
.ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--ac);background:none;color:#fff;font-size:17px;flex:none;padding:0}
.tk.done .ck{background:var(--ac)}
.tx{flex:1;font-size:15px;line-height:1.5}
.tx small{color:var(--mut);font-size:12px}
.tk .btns button{padding:3px 8px;min-width:30px;font-size:13px}
.x{border:0;background:none;color:var(--mut);font-size:18px}
.add{display:flex;gap:6px;margin:8px 0}
.add input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:11px;padding:10px;font-size:15px}
.add button{background:var(--ac);color:#fff;border:0;border-radius:11px;padding:0 16px;font-size:15px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sub button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 12px;font-size:13px}
.sub .on{background:var(--gold);color:#fff;border-color:var(--gold)}
.link{background:none;border:0;color:var(--ac);font-size:14px;padding:6px 2px;text-decoration:underline}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:8px 0;padding:0 12px}
summary{padding:13px 0;font-weight:700;color:var(--gold);list-style:none}
summary::after{content:"‹";float:left;color:var(--mut)}
details[open] summary::after{content:"⌄"}
details .card,details .c{background:var(--bg)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.c{border:1px solid var(--bd);border-radius:11px;padding:6px 4px;text-align:center}
.c.done{border-color:var(--ac);background:var(--ac2)}
.c .tap{width:100%;border:0;background:none;color:var(--tx);font-size:13px;padding:4px 0}
.c .n{font-size:18px;font-weight:700;color:var(--ac);display:block}
.c .n small{font-size:11px;color:var(--mut)}
.c .m{border:0;background:none;color:var(--mut);font-size:12px;padding:2px 6px}
.c label{display:block;font-size:11px;color:var(--mut)}
.chip{font-size:12px;background:var(--gl);color:var(--gold);border-radius:20px;padding:1px 10px;margin-inline-start:6px;font-weight:600}
.quote{background:linear-gradient(135deg,var(--ac2),var(--gl));border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:center}
.quote q{display:block;font-size:18px;font-weight:600;line-height:1.9;quotes:none}
.quote small{display:block;color:var(--mut);margin-top:6px}
.quote button{margin-top:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 14px;font-size:13px}
.tip b{display:block}.tip p{margin:0;color:var(--mut);font-size:14px}
textarea{width:100%;height:80px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:11px;padding:8px;font-size:12px;direction:ltr}
.reset{display:block;margin:18px auto 0;background:none;border:1px solid var(--bd);color:var(--mut);border-radius:11px;padding:8px 14px;font-size:13px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));max-width:680px;margin:auto}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font-size:12.5px;padding:6px 0;border-radius:12px}
.tabs button span{display:block;font-size:21px;line-height:1.2}
.tabs button.on{color:var(--ac);background:var(--ac2);font-weight:700}
.dn{flex:none;border:2px solid var(--ac);background:none;color:var(--ac);border-radius:20px;padding:6px 14px;font-size:14px;font-weight:700;transition:.15s}
.dn.on{background:var(--ac);color:#fff;animation:pop .35s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
button:active{transform:scale(.96)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:var(--ac);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:20;transition:transform .3s;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
#hd{background:linear-gradient(135deg,var(--ac2),var(--gl))}
.ring{display:flex;align-items:center;gap:12px}
.quote{cursor:pointer;margin:8px 0}
.card,.tk{transition:background .2s,border-color .2s}
.ei{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px;font-size:15px}
.tl{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.tl:first-of-type{border-top:0}
.tl b{display:block;font-size:14px}
.tl span{font-size:13.5px;color:var(--mut)}
.ta{width:100%;height:84px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:11px;padding:10px;font-size:15px;margin-top:6px;direction:rtl}
</style>
</head>
